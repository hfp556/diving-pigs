<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1622">
<title>十万母猪 · 河谷史诗</title>
<style>
  :root{
    --gold:#f0c674; --gold-dim:#c9a227; --ink:#0b1622; --paper:#ffe9c4;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#08111b;
    font-family:'Microsoft YaHei UI','PingFang SC',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  #c,#gl{position:fixed;top:0;left:0;display:block;width:100%;height:100%}
  #gl{pointer-events:none}
  /* 电影感暗角 + 极淡暖色调 */
  #vig{position:fixed;inset:0;pointer-events:none;z-index:2;
    background:
      radial-gradient(ellipse 78% 68% at 50% 44%, rgba(255,214,160,.05) 0%, transparent 58%),
      radial-gradient(ellipse 120% 100% at 50% 40%, transparent 52%, rgba(3,8,14,.52) 100%);
   }
  /* ── 标题牌 ─────────────────────────────── */
  #plaque{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:3;
    width:max-content;max-width:calc(100vw - 24px);
    text-align:center;padding:13px 40px 11px;border-radius:3px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,0) 42%),
      linear-gradient(180deg, rgba(10,18,30,.9), rgba(7,12,21,.78));
    box-shadow:0 10px 40px rgba(0,0,0,.45), inset 0 0 0 1px rgba(240,198,116,.18);
    border:1px solid rgba(240,198,116,.42);
  }
  #plaque::before{content:'';position:absolute;inset:4px;border:1px solid rgba(240,198,116,.16);pointer-events:none;border-radius:2px}
  #plaque .t{font-family:'Optima','Palatino Linotype','Songti SC',Georgia,serif;
    font-size:27px;font-weight:600;letter-spacing:.42em;text-indent:.42em;line-height:1.18;
    background:linear-gradient(178deg,#fff4d2 12%,#f0c674 46%,#b8862c 88%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 1px 0 rgba(0,0,0,.5))}
  #plaque .s{margin-top:5px;font-size:11.5px;letter-spacing:.22em;color:#c8b493;
    text-transform:uppercase;font-variant-numeric:tabular-nums}
  #plaque .s b{color:#f5d79a;font-weight:600;font-variant-numeric:tabular-nums}
  #ach{display:none;color:#8ce6a8;font-weight:600}
  /* ── 控制台 ─────────────────────────────── */
  #ctrl{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:3;
    display:flex;gap:12px 16px;align-items:center;justify-content:center;flex-wrap:wrap;
    width:max-content;max-width:calc(100vw - 20px);
    padding:10px 20px;border-radius:12px;
    background:
      linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 46%),
      linear-gradient(180deg, rgba(11,20,32,.92), rgba(6,11,19,.82));
    border:1px solid rgba(240,198,116,.3);
    box-shadow:0 14px 44px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
    color:#d9c9a8;font-size:13px;letter-spacing:.04em}
  #ctrl .lab{color:#9fbfd8;font-size:12px;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
  /* 手工滑杆 */
  #rate{-webkit-appearance:none;appearance:none;width:380px;height:22px;background:transparent;cursor:pointer}
  #rate::-webkit-slider-runnable-track{height:5px;border-radius:99px;
    background:linear-gradient(90deg,#24425e 0%,#d9a94e 55%,#c2708f 100%);
    box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 0 10px rgba(240,198,116,.14)}
  #rate::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6px;border-radius:50%;
    background:radial-gradient(circle at 34% 30%, #fffdf6, #f2d69c 62%, #c9982f 100%);
    border:1px solid rgba(255,246,222,.9);
    box-shadow:0 0 0 3px rgba(240,198,116,.16), 0 2px 8px rgba(0,0,0,.55);
    transition:transform .12s ease, box-shadow .12s ease}
  #rate:hover::-webkit-slider-thumb{transform:scale(1.12);box-shadow:0 0 0 5px rgba(240,198,116,.2),0 2px 10px rgba(0,0,0,.6)}
  #rate::-moz-range-track{height:5px;border-radius:99px;background:linear-gradient(90deg,#24425e,#d9a94e 55%,#c2708f)}
  #rate::-moz-range-thumb{width:15px;height:15px;border:1px solid #fff6de;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#fffdf6,#f2d69c 62%,#c9982f)}
  #rateV{font-variant-numeric:tabular-nums;color:#f5d79a;font-weight:600;min-width:66px;text-align:right}
  .unit{color:#8faec4;font-size:11.5px;white-space:nowrap}
  button{font-family:inherit;font-size:12.5px;letter-spacing:.06em;font-weight:600;color:#1b1305;cursor:pointer;
    white-space:nowrap;
    padding:7px 15px;border-radius:9px;border:1px solid rgba(255,247,224,.75);
    background:linear-gradient(180deg,#ffd98d,#eab84e 60%,#c9972f);
    box-shadow:0 3px 12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.55);
    transition:transform .1s ease, filter .1s ease, box-shadow .1s ease}
  button:hover{filter:brightness(1.07);transform:translateY(-1px);
    box-shadow:0 6px 18px rgba(240,198,116,.24), inset 0 1px 0 rgba(255,255,255,.6)}
  button:active{transform:translateY(1px);filter:brightness(.95)}
  #snd,#pause{background:linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    color:#f0dcb4;border:1px solid rgba(240,198,116,.4);box-shadow:0 3px 12px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.12)}
  #snd:hover,#pause:hover{background:linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.08))}
  #stat{color:#8fb2cc;font-size:11.5px;letter-spacing:.02em;white-space:nowrap;
    max-width:340px;overflow:hidden;text-overflow:ellipsis;
    font-variant-numeric:tabular-nums;border-left:1px solid rgba(240,198,116,.22);padding-left:14px}
  #stat .hot{color:#8ce6a8}
  #stat .warn{color:#f0a38c}
  /* 左下角水印 */
  #mark{position:fixed;left:22px;bottom:20px;z-index:3;color:rgba(232,213,176,.34);
    font-size:10.5px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;
    font-family:'Optima','Palatino Linotype',Georgia,serif}
  /* 诊断条:排查黑屏用,常显 */
  #diag{position:fixed;left:8px;top:8px;z-index:4;pointer-events:none;
    font:10px/1.45 ui-monospace,Consolas,monospace;color:rgba(180,214,240,.72);
    background:rgba(4,10,18,.55);border:1px solid rgba(120,170,210,.18);
    border-radius:5px;padding:4px 7px;white-space:pre;max-width:44vw;overflow:hidden}
  @media (max-width:1180px){ #stat{display:none} #rate{width:240px} }  @media (max-width:900px){
    #rate{width:min(52vw,300px)}
    #ctrl{padding:8px 12px;gap:8px 12px;bottom:10px;font-size:12px}
    #ctrl .lab{font-size:10.5px;letter-spacing:.08em}
    #plaque{top:10px;padding:8px 16px;max-width:calc(100vw - 20px)}
    #plaque .t{font-size:18px;letter-spacing:.26em;text-indent:.26em}
    #plaque .s{font-size:9.5px;letter-spacing:.12em}
    #mark{display:none}
    button{padding:6px 11px;font-size:11.5px}
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="gl"></canvas>
<div id="vig"></div>
<div id="plaque">
  <div class="t">十万母猪·河谷史诗</div>
  <div class="s">Operation Pork Dive &nbsp;·&nbsp; 已跳水 <b id="count">0</b> / 100,000 头 <span id="ach">🎉 十万个对不起,已随水流送达</span></div>
</div>
<div id="ctrl">
  <span class="lab">入场流量</span>
  <input id="rate" type="range" min="100" max="100000" step="100" value="150">
  <span id="rateV">140</span><span class="unit"> 头/秒</span>
  <button id="burst">冲刺十万</button>
  <button id="snd">🔇 音效</button>
  <button id="pause">‖ 暂停</button>
  <span id="stat"></span>
</div>
<div id="mark">Valley of Ten Thousand Sows</div>
<div id="diag">booting…</div>
<script>
'use strict';
window.onerror = function(msg, src, line){
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;top:120px;left:8px;color:#ff9a9a;font:12px ui-monospace,monospace;'+
    'background:rgba(0,0,0,.82);padding:8px 10px;z-index:99;max-width:900px;white-space:pre-wrap;border-radius:6px';
  d.textContent = 'ERR: ' + msg + ' @line ' + line;
  document.body.appendChild(d);
};
/* ══════════════════════════════════════════════════════════════════
   十万母猪 · 河谷史诗
   · 五层木质看台排队 → 逐只跃入河谷 → 水下顺流漂走
   · 随机吨位母猪王(10-99t),吨位决定体型/水花/震屏
   · 圣诞驯鹿雪橇随机横穿,半路坠河
   · 渲染:WebGL2 实例化(powerPreference=high-performance 争取独显) → Canvas2D 兜底
     启动时回读像素自检,驱动静默失败则自动降级
   性能:存活链表 O(在场) 遍历 / exp 查表 / 水花按流量抽样 /
        bufferSubData 免视图 / 逐帧模拟步数封顶 / 光效全精灵化
   ══════════════════════════════════════════════════════════════════ */
const W = 1600, H = 900, WATER_Y = 660;
const TIER_Y = [340, 405, 470, 535, 600], EDGE_X = [560, 610, 660, 710, 760];
const HERO_PED_X = 470, HERO_PED_TOP = 324;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let glc = document.getElementById('gl');
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
let RS = DPR;
const TAU = Math.PI * 2;

/* ── 工具 ───────────────────────────────────────────────── */
function mkCanvas(w,h){ const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function radialSprite(size, stops){
  const c = mkCanvas(size,size), g = c.getContext('2d'), r = size/2;
  const rg = g.createRadialGradient(r,r,0,r,r,r);
  for(const [p,col] of stops) rg.addColorStop(p,col);
  g.fillStyle = rg; g.fillRect(0,0,size,size); return c;
}

/* ══ 母猪精灵:0-2 俯冲(三种翻滚角) 3 行走(侧视) ═══════════ */
function pigBody(g, rx, ry, warm){
  const rg = g.createRadialGradient(-rx*.22, -ry*.34, 1, 0, 0, Math.max(rx,ry)*1.28);
  rg.addColorStop(0, warm? '#fff0f6':'#ffe6f0');
  rg.addColorStop(.5, '#f9b3cf');
  rg.addColorStop(.84,'#ef8fb4');
  rg.addColorStop(1, '#dd7ba4');
  g.fillStyle = rg;
  g.beginPath(); g.ellipse(0,0,rx,ry,0,0,TAU); g.fill();
  g.strokeStyle = 'rgba(190,90,125,.55)'; g.lineWidth = 1.1; g.stroke();
  // 暖色轮廓光(右上一侧,呼应夕阳)
  g.strokeStyle = 'rgba(255,238,214,.5)'; g.lineWidth = 1.7;
  g.beginPath(); g.ellipse(0,0,rx*.96,ry*.96,0,-1.5,-.12); g.stroke();
}
function drawPigDive(g){
  g.lineCap = 'round';
  g.strokeStyle = '#d96a95'; g.lineWidth = 2.6;
  g.beginPath(); g.moveTo(0,-22); g.quadraticCurveTo(7,-27,4,-33);
  g.quadraticCurveTo(1,-38,-3,-34); g.quadraticCurveTo(-5,-31,-1,-30); g.stroke();
  g.strokeStyle = '#f2a0c0'; g.lineWidth = 5.5;
  const leg = (a,b,c2,d)=>{ g.beginPath(); g.moveTo(a,b); g.lineTo(c2,d); g.stroke(); };
  leg(-12,-4,-23,-11); leg(12,-4,23,-11); leg(-11,10,-21,17); leg(11,10,21,17);
  g.fillStyle = '#f48fb1'; g.strokeStyle = '#c25e8a'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(-11,-15); g.quadraticCurveTo(-18,-23,-14,-27);
  g.quadraticCurveTo(-8,-24,-5,-18); g.closePath(); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(11,-15); g.quadraticCurveTo(18,-23,14,-27);
  g.quadraticCurveTo(8,-24,5,-18); g.closePath(); g.fill(); g.stroke();
  pigBody(g, 14, 21, true);
  g.fillStyle = 'rgba(255,228,238,.5)'; g.beginPath(); g.ellipse(-3,4,7,11,0,0,TAU); g.fill();
  g.fillStyle = '#f48fb1'; g.beginPath(); g.ellipse(0,20,8.5,6,0,0,TAU); g.fill();
  g.strokeStyle = '#c25e8a'; g.lineWidth = 1.1; g.stroke();
  g.fillStyle = '#a94d72';
  g.beginPath(); g.ellipse(-3,21,1.6,2.1,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(3,21,1.6,2.1,0,0,TAU); g.fill();
  g.strokeStyle = '#7a3b58'; g.lineWidth = 1.7;
  g.beginPath(); g.moveTo(-8.5,11.5); g.quadraticCurveTo(-5.5,13.9,-2.5,11.5); g.stroke();
  g.beginPath(); g.moveTo(2.5,11.5); g.quadraticCurveTo(5.5,13.9,8.5,11.5); g.stroke();
  g.fillStyle = 'rgba(255,143,179,.42)';
  g.beginPath(); g.arc(-10,14,2.6,0,TAU); g.fill();
  g.beginPath(); g.arc(10,14,2.6,0,TAU); g.fill();
}
function drawPigWalk(g){
  g.lineCap = 'round';
  // 落地软阴影
  g.fillStyle = 'rgba(48,26,16,.2)';
  g.beginPath(); g.ellipse(0,17.5,14,3.4,0,0,TAU); g.fill();
  g.strokeStyle = '#d96a95'; g.lineWidth = 2.4;
  g.beginPath(); g.moveTo(-15,-4); g.quadraticCurveTo(-21,-8,-19,-13);
  g.quadraticCurveTo(-17,-16,-14,-13); g.stroke();
  g.fillStyle = '#f48fb1'; g.strokeStyle = '#c25e8a'; g.lineWidth = 1.2;
  g.beginPath(); g.moveTo(7,-9); g.quadraticCurveTo(8,-16,13,-17);
  g.quadraticCurveTo(15,-11,11,-6); g.closePath(); g.fill(); g.stroke();
  g.strokeStyle = '#f2a0c0'; g.lineWidth = 4.6;
  const leg = (a,b,c2,d)=>{ g.beginPath(); g.moveTo(a,b); g.lineTo(c2,d); g.stroke(); };
  leg(-10,8,-10,15); leg(-4,9,-4,16); leg(4,9,4,16); leg(10,8,10,15);
  pigBody(g, 17, 12, false);
  g.fillStyle = 'rgba(255,228,238,.46)'; g.beginPath(); g.ellipse(-2,4,10,5,0,0,TAU); g.fill();
  g.fillStyle = '#f48fb1'; g.beginPath(); g.ellipse(15,2,5.5,4.5,0,0,TAU); g.fill();
  g.strokeStyle = '#c25e8a'; g.lineWidth = 1.1; g.stroke();
  g.fillStyle = '#a94d72';
  g.beginPath(); g.ellipse(16.5,1.2,1.2,1.6,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(16.5,3.6,1.2,1.6,0,0,TAU); g.fill();
  g.strokeStyle = '#7a3b58'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(5,-2); g.quadraticCurveTo(7,0,9,-2); g.stroke();
  g.fillStyle = 'rgba(255,143,179,.42)'; g.beginPath(); g.arc(9,3,2.2,0,TAU); g.fill();
}
const pigSprites = [-0.3, 0, 0.3].map(rot=>{
  const c = mkCanvas(128,128), g = c.getContext('2d');
  g.translate(64,64); g.rotate(rot); g.scale(2,2); drawPigDive(g);
  return c;
}).concat([(()=>{
  const c = mkCanvas(128,128), g = c.getContext('2d');
  g.translate(64,64); g.scale(2,2); drawPigWalk(g);
  return c;
})()]);
const atlas = mkCanvas(512,128);
{ const g = atlas.getContext('2d'); pigSprites.forEach((s,i)=>g.drawImage(s, i*128, 0)); }
/* Canvas2D 兜底用的"水下蓝调"版本 */
const underSprites = pigSprites.map(s=>{
  const c = mkCanvas(128,128), g = c.getContext('2d');
  g.drawImage(s,0,0);
  g.globalCompositeOperation = 'source-atop';
  g.fillStyle = 'rgba(16,70,108,.55)';
  g.fillRect(0,0,128,128);
  return c;
});
const SPR = 62, TILE_WALK = 3;

/* ══ 粒子与光效贴图(全部预渲染,运行时只 blit) ═════════════ */
const SPR_RING = (()=>{
  const c = mkCanvas(64,64), g = c.getContext('2d');
  const rg = g.createLinearGradient(0,32,64,32);
  rg.addColorStop(0,'rgba(230,248,255,.15)'); rg.addColorStop(.5,'rgba(255,255,255,.95)');
  rg.addColorStop(1,'rgba(230,248,255,.15)');
  g.strokeStyle = rg; g.lineWidth = 4;
  g.beginPath(); g.ellipse(32,32,27,8.4,0,0,TAU); g.stroke(); return c;
})();
const SPR_BUB = (()=>{
  const c = mkCanvas(32,32), g = c.getContext('2d');
  g.strokeStyle = 'rgba(215,240,255,.62)'; g.lineWidth = 1.8;
  g.beginPath(); g.arc(16,16,11.5,0,TAU); g.stroke();
  g.fillStyle = 'rgba(255,255,255,.42)'; g.beginPath(); g.arc(12,12,3.1,0,TAU); g.fill();
  return c;
})();
const SPR_DROP = radialSprite(32,[[0,'rgba(244,252,255,1)'],[.45,'rgba(226,244,255,.62)'],[1,'rgba(226,244,255,0)']]);
const SPR_GLINT = (()=>{
  const c = mkCanvas(64,16), g = c.getContext('2d');
  const rg = g.createRadialGradient(32,8,0,32,8,32);
  rg.addColorStop(0,'rgba(255,246,214,.95)'); rg.addColorStop(1,'rgba(255,230,170,0)');
  g.fillStyle = rg; g.beginPath(); g.ellipse(32,8,32,7,0,0,TAU); g.fill(); return c;
})();
const SPR_POLLEN = radialSprite(16,[[0,'rgba(255,240,200,.9)'],[.5,'rgba(255,226,168,.35)'],[1,'rgba(255,226,168,0)']]);
/* 太阳光芒:预渲染一张,运行时旋转贴图(替代每帧 12 条路径) */
const SPR_RAYS = (()=>{
  const S = 900, c = mkCanvas(S,S), g = c.getContext('2d'), C = S/2;
  g.translate(C,C);
  for(let i=0;i<16;i++){
    g.rotate(TAU/16);
    const w = i%2? 7 : 15, len = i%2? 400 : 460;
    const rg = g.createLinearGradient(0,0,0,-len);
    rg.addColorStop(0,'rgba(255,226,168,.20)'); rg.addColorStop(1,'rgba(255,226,168,0)');
    g.fillStyle = rg;
    g.beginPath(); g.moveTo(-w,0); g.lineTo(0,-len); g.lineTo(w,0); g.closePath(); g.fill();
  }
  return c;
})();
const SPR_HALO = radialSprite(420,[[0,'rgba(255,238,196,.75)'],[.22,'rgba(255,206,140,.34)'],[.55,'rgba(255,180,110,.11)'],[1,'rgba(255,170,100,0)']]);
/* 水下光柱:预渲染梯形软光 */
const SPR_SHAFT = (()=>{
  const w = 190, h = 380, c = mkCanvas(w,h), g = c.getContext('2d');
  const rg = g.createLinearGradient(0,0,0,h);
  rg.addColorStop(0,'rgba(226,246,255,.20)'); rg.addColorStop(.55,'rgba(198,236,255,.08)');
  rg.addColorStop(1,'rgba(198,236,255,0)');
  g.fillStyle = rg;
  g.beginPath(); g.moveTo(w*.36,0); g.lineTo(w*.64,0); g.lineTo(w, h*.92); g.lineTo(0, h*.92); g.closePath(); g.fill();
  return c;
})();
/* 云:3 种预渲染软云(替代每帧椭圆路径) */
const SPR_CLOUDS = [0,1,2].map(k=>{
  const w = 340, h = 130, c = mkCanvas(w,h), g = c.getContext('2d');
  const puffs = [[86,74,66,26],[150,60,80,30],[224,72,72,24],[268,80,54,18],[52,84,48,17]];
  for(const [x,y,rx,ry] of puffs){
    const rg = g.createRadialGradient(x,y,0,x,y,rx);
    const a = .30 - k*.05;
    rg.addColorStop(0,`rgba(255,248,236,${a})`);
    rg.addColorStop(.55,`rgba(246,232,214,${a*.6})`);
    rg.addColorStop(1,'rgba(240,224,206,0)');
    g.fillStyle = rg;
    g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); g.fill();
  }
  return c;
});
/* 水下焦散光网(可平铺) */
const SPR_CAUSTIC = (()=>{
  const S = 256, c = mkCanvas(S,S), g = c.getContext('2d');
  g.lineCap = 'round';
  for(let i=0;i<26;i++){
    const x = Math.random()*S, y = Math.random()*S, r = 18+Math.random()*52;
    const a0 = Math.random()*TAU, a1 = a0 + .8 + Math.random()*1.6;
    g.strokeStyle = `rgba(198,240,255,${.04+Math.random()*.07})`;
    g.lineWidth = 1.4+Math.random()*2.4;
    g.beginPath(); g.arc(x,y,r,a0,a1); g.stroke();
  }
  return c;

/* ══ 模拟层:SoA + 槽位池 + 存活链表 ═══════════════════════ */
const MAX = 250000, DEAD = 255;
const PX = new Float32Array(MAX), PY = new Float32Array(MAX),
      VX = new Float32Array(MAX), VY = new Float32Array(MAX),
      SC = new Float32Array(MAX), AL = new Float32Array(MAX), WOB = new Float32Array(MAX),
      PH = new Uint8Array(MAX).fill(DEAD), VAR = new Uint8Array(MAX), TIER = new Uint8Array(MAX);
const ALIVE = new Int32Array(MAX), AIDX = new Int32Array(MAX);
const free = []; let hi = 0, aliveN = 0;
/* 流量条映射(内部参数) */
const SLIDER_MIN = 100, SLIDER_MAX = 100000, RATE_MAX = 30000;
const RATE_P = Math.log(RATE_MAX/SLIDER_MIN) / Math.log(SLIDER_MAX/SLIDER_MIN);
const RATE_K = SLIDER_MIN / Math.pow(SLIDER_MIN, RATE_P);
const sliderRate = v => Math.round(RATE_K * Math.pow(Math.max(v, SLIDER_MIN), RATE_P));
let total = 0, rate = sliderRate(150), paused = false, spawnAcc = 0;
const drops = [], ripples = [], bubbles = [], burst = [];
let shock = {x:620, r:0, a:0}, shake = 0, shakePow = 1;
let hero = null, heroNextIn = 2.5;
const deer = [], sinkers = [];
let deerNextIn = 9 + Math.random()*14;
let dropBudget = 3, rippleBudget = 1, bubbleBudget = 1;
/* 水流指数衰减查表:替代每次 Math.exp */
const EXP_N = 256, EXP_LUT = new Float32Array(EXP_N);
for(let i=0;i<EXP_N;i++) EXP_LUT[i] = Math.exp(-(i*3)/160);

function spawnPig(){
  const i = free.length ? free.pop() : (hi < MAX ? hi++ : -1);
  if(i < 0) return;
  const tier = (Math.random()*5)|0;
  TIER[i] = tier;
  const span = EDGE_X[tier]-124;
  PX[i] = 100 + span*Math.pow(Math.random(), 1.6);
  SC[i] = .55+Math.random()*.95;
  PY[i] = TIER_Y[tier] - SC[i]*16;
  VX[i] = Math.min(460, 90+rate*1.05)*(0.8+Math.random()*0.4);
  VY[i] = 0; PH[i] = 0; VAR[i] = TILE_WALK; AL[i] = 1; WOB[i] = Math.random()*7;
  ALIVE[aliveN] = i; AIDX[i] = aliveN; aliveN++;
}
function kill(i){
  PH[i] = DEAD; free.push(i);
  const k = AIDX[i], last = --aliveN, j = ALIVE[last];
  ALIVE[k] = j; AIDX[j] = k;
}
function pushCap(arr, o, cap){ if(arr.length >= cap) arr[(Math.random()*cap)|0] = o; else arr.push(o); }
function splashAt(x, s, big){
  const n = big? 24 : dropBudget;
  for(let i=0;i<n;i++) pushCap(drops, {
    x: x + (Math.random()-.5)*30*s, y: WATER_Y-2,
    vx: (Math.random()-.5)*(big?420:190), vy: -(90+Math.random()*(big?380:230)),
    r: (2+Math.random()*3)*s, life: .7+Math.random()*.5, t:0 }, 3000);
  if(big || Math.random() < rippleBudget)
    pushCap(ripples, { x, y: WATER_Y+6, r: 4*s, v: (big?260:110)*s, a:.85 }, 1200);
  if(!big && Math.random() < .18*bubbleBudget)
    pushCap(bubbles, { x: x+(Math.random()-.5)*20, y: WATER_Y+14, r:1.5+Math.random()*2.5, t:0 }, 700);
  if(big || Math.random() < .18) playSplash(big? .85 : .15+.25*Math.min(s,1.5));
}

const STEP = 1/60;

/* ══ 音效:全合成 ═══════════════════════════════════════════ */
let AC = null, masterGain = null, noiseBuf = null, muted = true, lastSplashSnd = 0;
function ensureAudio(){
  if(AC) return;
  try{
    AC = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = AC.createGain(); masterGain.gain.value = .55; masterGain.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate*.5|0, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  }catch(e){ AC = null; }
}
function playSplash(size){
  if(muted || !AC) return;
  const t = AC.currentTime;
  if(t - lastSplashSnd < .08) return;
  lastSplashSnd = t;
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'bandpass';
  f.frequency.value = 1000 - 550*size + Math.random()*250; f.Q.value = .8;
  const g = AC.createGain();
  g.gain.setValueAtTime(.001, t);
  g.gain.exponentialRampToValueAtTime(.05 + .3*size, t+.02);
  g.gain.exponentialRampToValueAtTime(.001, t+.22+.35*size);
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start(t); src.stop(t+.7);
}
function playBoom(power){
  if(muted || !AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(110 - 30*power, t);
  o.frequency.exponentialRampToValueAtTime(28, t+.5);
  const g = AC.createGain();
  g.gain.setValueAtTime(.001, t);
  g.gain.exponentialRampToValueAtTime(.4*power + .15, t+.015);
  g.gain.exponentialRampToValueAtTime(.001, t+.65);
  o.connect(g); g.connect(masterGain);
  o.start(t); o.stop(t+.7);
  const src = AC.createBufferSource(); src.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420;
  const g2 = AC.createGain();
  g2.gain.setValueAtTime(.28*power + .08, t);
  g2.gain.exponentialRampToValueAtTime(.001, t+.4);
  src.connect(f); f.connect(g2); g2.connect(masterGain);
  src.start(t); src.stop(t+.5);
}
function playJingle(){
  if(muted || !AC) return;
  const t = AC.currentTime;
  [1568, 2093].forEach((fq,i)=>{
    const o = AC.createOscillator(); o.type = 'triangle'; o.frequency.value = fq;
    const g = AC.createGain();
    g.gain.setValueAtTime(.001, t+i*.12);
    g.gain.exponentialRampToValueAtTime(.1, t+i*.12+.01);
    g.gain.exponentialRampToValueAtTime(.001, t+i*.12+.25);
    o.connect(g); g.connect(masterGain);
    o.start(t+i*.12); o.stop(t+i*.12+.3);
  });
}

/* ══ 模拟步进 ══════════════════════════════════════════════ */
const splashProb = () => rate > 900? Math.max(.03, 900/rate) : 1;
function update(dt, t){
  spawnAcc += rate*dt;
  while(spawnAcc >= 1){ spawnAcc--; spawnPig(); }
  const sp = splashProb();
  for(let k=0;k<aliveN;k++){
    const i = ALIVE[k];
    if(PH[i] === 0){                                    // 看台排队前行
      PX[i] += VX[i]*dt;
      if(PX[i] >= EDGE_X[TIER[i]]-4){
        PH[i] = 1; VX[i] = VX[i]*.6+25; VY[i] = -(50+Math.random()*90);
      }
    } else if(PH[i] === 1){                             // 腾空一跃
      VY[i] += 620*dt; PX[i] += VX[i]*dt; PY[i] += VY[i]*dt;
      if(VY[i] > 130 && VAR[i] === TILE_WALK) VAR[i] = (Math.random()*3)|0;
      if(PY[i] >= WATER_Y+4){
        PH[i] = 2; total++; PY[i] = WATER_Y+4;
        VY[i] = 26+Math.random()*22;
        if(Math.random() < sp) splashAt(PX[i], SC[i], false);
      }
    } else {                                            // 沉入水中,顺流而下
      const depth = PY[i] - WATER_Y;
      const di = depth > 0? (depth*(1/3))|0 : 0;
      const cur = 60 + 130*EXP_LUT[di < EXP_N? di : EXP_N-1];
      VX[i] += (cur - VX[i])*dt*1.5;
      VY[i] += (30 - VY[i])*dt;
      PX[i] += VX[i]*dt; PY[i] += VY[i]*dt;
      if(depth > H-WATER_Y-60) AL[i] -= dt*1.6;
      if(PX[i] > W+50 || AL[i] <= .04 || PY[i] > H-8){ kill(i); k--; continue; }
      if(Math.random() < dt*.45*bubbleBudget)
        pushCap(bubbles, {x:PX[i], y:PY[i]-8, r:1+Math.random()*2.2, t:0}, 700);
    }
  }
  for(let i=drops.length-1;i>=0;i--){ const d=drops[i]; d.t+=dt; d.vy+=760*dt; d.x+=d.vx*dt; d.y+=d.vy*dt;
    if(d.t>d.life || d.y>WATER_Y+8){ drops[i]=drops[drops.length-1]; drops.pop(); } }
  for(let i=ripples.length-1;i>=0;i--){ const r=ripples[i]; r.r+=r.v*dt; r.a-=dt*1.4; r.v*=1-1.2*dt;
    if(r.a<=0){ ripples[i]=ripples[ripples.length-1]; ripples.pop(); } }
  for(let i=bubbles.length-1;i>=0;i--){ const b=bubbles[i]; b.t+=dt; b.y-=36*dt; b.x+=Math.sin(t*6+b.y)*10*dt;
    if(b.y<WATER_Y+6 || b.t>2.4){ bubbles[i]=bubbles[bubbles.length-1]; bubbles.pop(); } }
  /* 母猪王 */
  if(!hero){
    heroNextIn -= dt;
    if(heroNextIn <= 0){
      const tn = 10 + ((Math.random()*90)|0);
      const s = 1.9 + tn/99*1.4;
      hero = { t:0, tn, s, standY: HERO_PED_TOP - s*16,
               standDur: 1.6 + Math.random()*1.8, landX: 590 + tn/99*140 };
    }
  } else {
    hero.t += dt;
    if(hero.t >= hero.standDur + 1.3){
      shake = 1; shakePow = .5 + hero.tn/99*2.0;
      shock = {x: hero.landX, r: 30, a: .95};
      const k2 = hero.s/2, nb = Math.min(150, (70 + hero.tn*.8)|0);
      for(let i=0;i<nb;i++) pushCap(burst, {
        x: hero.landX+(Math.random()-.5)*46*k2, y: WATER_Y-4,
        vx: (Math.random()-.5)*300, vy: -(120+Math.random()*460),
        r: (4+Math.random()*13)*k2, t:0, life:1+Math.random()*.9, puff:false }, 280);
      for(let i=0;i<10;i++) pushCap(burst, {
        x: hero.landX+(Math.random()-.5)*70*k2, y: WATER_Y-10-Math.random()*40,
        vx: (Math.random()-.5)*60, vy: -(40+Math.random()*90),
        r: (22+Math.random()*26)*k2, t:0, life:1.6, puff:true }, 280);
      splashAt(hero.landX, hero.s*1.4, true);
      playBoom(.35 + hero.tn/99*1.1);
      hero = null;
      const hm = Math.min(3, Math.max(1, rate/800));
      heroNextIn = (6 + Math.random()*9) / hm;
    }
  }
  /* 驯鹿 */
  const dm = Math.min(5, Math.max(1, rate/400));
  deerNextIn -= dt;
  if(deerNextIn <= 0){
    if(deer.length < 2){
      const dir = Math.random()<.5? 1 : -1;
      deer.push({ x: dir>0? -240 : W+240, y: 90+Math.random()*170,
        vx: dir*(240+Math.random()*130), t:0, seed: Math.random()*7,
        fallAt: W*(.3+Math.random()*.45), phase:0, rot:0, vr:(Math.random()-.5)*4, vy:0, flip: dir<0 });
      playJingle();
    }
    deerNextIn = (16 + Math.random()*22) / dm;
  }
  for(let i=deer.length-1;i>=0;i--){
    const d = deer[i]; d.t += dt;
    if(d.phase === 0){
      d.x += d.vx*dt; d.y += Math.sin(d.t*2.2+d.seed)*14*dt;
      if((d.vx>0 && d.x>=d.fallAt) || (d.vx<0 && d.x<=d.fallAt)){ d.phase=1; d.vy=0; }
      if(d.x < -280 || d.x > W+280) deer.splice(i,1);
    } else {
      d.vy += 520*dt; d.x += d.vx*.4*dt; d.y += d.vy*dt; d.rot += d.vr*dt;
      if(d.y >= WATER_Y+6){
        splashAt(d.x, 1.5, true); playSplash(.9);
        sinkers.push({ x:d.x, y:WATER_Y+16, rot:d.rot, vy:40, alpha:1, flip:d.flip });
        deer.splice(i,1);
      }
    }
  }
  for(let i=sinkers.length-1;i>=0;i--){
    const s = sinkers[i]; s.y += s.vy*dt; s.vy *= (1-.5*dt); s.alpha -= dt*.45;
    if(Math.random() < dt*1.6) pushCap(bubbles,{x:s.x+(Math.random()-.5)*40,y:s.y,r:2+Math.random()*3,t:0},700);
    if(s.alpha <= 0){ sinkers[i]=sinkers[sinkers.length-1]; sinkers.pop(); }
  }
  for(let i=burst.length-1;i>=0;i--){
    const b = burst[i]; b.t += dt;
    if(!b.puff) b.vy += 430*dt;
    else { b.vy *= (1-1.4*dt); b.vx += Math.sin(b.t*5)*8*dt; }
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(b.t > b.life){ burst[i]=burst[burst.length-1]; burst.pop(); }
  }
  if(shock.a > 0){ shock.r += 430*dt; shock.a -= dt*1.7; }
  shake = Math.max(0, shake - dt*2.2);
}

/* ══ GPU 检测与管线 ═══════════════════════════════════════ */
/* GPU 分类:仅用于如实显示;未知/移动 GPU 一律按非独显处理(安全侧) */
function classifyGPU(s){
  if(/nvidia|geforce|rtx|gtx|quadro/i.test(s)) return ['独立显卡', true];
  if(/radeon rx|radeon pro|radeon vii|rx \d{3,4}|arc a\d/i.test(s)) return ['独立显卡', true];
  if(/adreno|mali|powervr|imagination|apple|arm |tegra|qualcomm/i.test(s)) return ['移动 GPU', false];
  if(/radeon/i.test(s)) return ['核显/APU', false];
  if(/intel|uhd|iris|hd graphics/i.test(s)) return ['核显', false];
  if(/swiftshader|llvmpipe|software|basic render/i.test(s)) return ['软件渲染', false];
  return ['显卡', false];
}
let gl = null, prog = null, instBuf = null, vao = null, uWorld = null, GL_LOST = false;
const INST = new Float32Array(MAX*6);
function resetGLCanvas(){
  const n = glc.cloneNode(false);
  glc.replaceWith(n); glc = n;
}
function initGL(){
  try{
    gl = glc.getContext('webgl2', {alpha:true, premultipliedAlpha:false, antialias:false,
      depth:false, stencil:false, powerPreference:'high-performance'});
    if(!gl) return false;
    // 不能与底下的 2D 画布合成(alpha=false)时,GL 画布会盖成不透明黑 → 直接放弃 GL
    const at = gl.getContextAttributes ? gl.getContextAttributes() : null;
    if(at && at.alpha === false) return false;
    glc.addEventListener('webglcontextlost', e=>{ e.preventDefault(); GL_LOST = true; }, false);
    const vsh = `#version 300 es
layout(location=0) in vec2 aCorner;
layout(location=1) in vec2 aPos;
layout(location=2) in float aSize;
layout(location=3) in float aTile;
layout(location=4) in float aAlpha;
layout(location=5) in float aTint;
uniform vec2 uWorld;
out vec2 vUV; out float vA; out float vT;
void main(){
  vec2 clip = vec2(aPos.x/uWorld.x*2.-1., 1.-aPos.y/uWorld.y*2.);
  clip += aCorner*aSize*vec2(2./uWorld.x, -2./uWorld.y);
  gl_Position = vec4(clip, 0., 1.);
  vUV = vec2((aTile + aCorner.x + .5)/4., 1.-(aCorner.y+.5));
  vA = aAlpha; vT = aTint;
}`;
    const fsh = `#version 300 es
precision mediump float;
in vec2 vUV; in float vA; in float vT;
uniform sampler2D uTex;
out vec4 o;
void main(){
  vec4 c = texture(uTex, vUV);
  c.rgb = mix(c.rgb, vec3(.13,.36,.55), vT);
  o = vec4(c.rgb, c.a*vA);
}`;
    const sh = (t,src)=>{ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
      if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw gl.getShaderInfoLog(s); return s; };
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vsh));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fsh));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    uWorld = gl.getUniformLocation(prog, 'uWorld');
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, atlas);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    vao = gl.createVertexArray(); gl.bindVertexArray(vao);
    const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.5,-.5, .5,-.5, -.5,.5, .5,.5]), gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
    instBuf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, INST.byteLength, gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 24, 0);  gl.vertexAttribDivisor(1,1);
    gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 24, 8);  gl.vertexAttribDivisor(2,1);
    gl.enableVertexAttribArray(3); gl.vertexAttribPointer(3, 1, gl.FLOAT, false, 24, 12); gl.vertexAttribDivisor(3,1);
    gl.enableVertexAttribArray(4); gl.vertexAttribPointer(4, 1, gl.FLOAT, false, 24, 16); gl.vertexAttribDivisor(4,1);
    gl.enableVertexAttribArray(5); gl.vertexAttribPointer(5, 1, gl.FLOAT, false, 24, 20); gl.vertexAttribDivisor(5,1);
    gl.enable(gl.BLEND); gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    return true;
  }catch(e){ return false; }
}
function glRendererString(){
  try{
    const ext = gl.getExtension('WEBGL_debug_renderer_info');
    return ext? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : 'WebGL2';
  }catch(e){ return 'WebGL2'; }
}
function fallbackTo2D(){
  GL_LOST = false;
  try{ resetGLCanvas(); }catch(e){}
  RENDERER = {kind:'canvas2d', gpuName:'Canvas2D 兜底', tag:'软件渲染'};
}
function renderGL(){
  gl.viewport(0,0,glc.width,glc.height);
  gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT);
  if(!instN) return;
  gl.uniform2f(uWorld, W, H);
  gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, INST, 0, instN*6);   // 免 subarray 视图分配
  gl.bindVertexArray(vao);
  gl.drawArraysInstanced(gl.TRIANGLE_STRIP, 0, 4, instN);
}
/* 探活:在一次性小画布上验证"GPU 真的光栅化且能回读",绝不碰主画布 */
function glSanity(){
  try{
    const c2 = document.createElement('canvas'); c2.width = c2.height = 4;
    const g2 = c2.getContext('webgl2', {alpha:false, antialias:false, depth:false, stencil:false});
    if(!g2) return false;
    g2.clearColor(.25,.5,.75,1); g2.clear(g2.COLOR_BUFFER_BIT);
    const px = new Uint8Array(4);
    g2.readPixels(1,1,1,1,g2.RGBA,g2.UNSIGNED_BYTE,px);
    const ok = px[2] > 90;
    const lc = g2.getExtension('WEBGL_lose_context');
    if(lc) lc.loseContext();
    return ok;
  }catch(e){ return false; }
}
let RENDERER = {kind:'canvas2d', gpuName:'软件渲染', tag:'软件渲染'};
function initRenderer(){
  if(glSanity() && initGL()){
    const s = glRendererString();
    return {kind:'webgl2', gpuName:s, tag: classifyGPU(s)[0]};
  }
  try{ resetGLCanvas(); }catch(e){}
  return {kind:'canvas2d', gpuName:'Canvas2D 兜底', tag:'软件渲染'};
}

/* ══ 缓存渐变与图案 ═══════════════════════════════════════ */
const gradWater = ctx.createLinearGradient(0, WATER_Y, 0, H);
gradWater.addColorStop(0,   'rgba(126,198,224,.38)');
gradWater.addColorStop(.12, 'rgba(44,122,170,.50)');
gradWater.addColorStop(.38, 'rgba(18,80,124,.60)');
gradWater.addColorStop(.7,  'rgba(8,44,78,.70)');
gradWater.addColorStop(1,   'rgba(2,18,36,.82)');
const gradBedHaze = ctx.createLinearGradient(0, WATER_Y, 0, WATER_Y+170);
gradBedHaze.addColorStop(0,'rgba(150,212,242,.12)'); gradBedHaze.addColorStop(1,'rgba(150,212,242,0)');
const patCaustic = ctx.createPattern(SPR_CAUSTIC, 'repeat');
const patGrain = ctx.createPattern(SPR_GRAIN, 'repeat');

/* ══ 场景渲染(不含猪,猪走 GL 实例化) ═════════════════════ */
const CLOUDS = [
  {k:0, y:104, sp:9,  sc:1.15}, {k:1, y:152, sp:13, sc:.9},
  {k:2, y:196, sp:17, sc:1.35}, {k:1, y:238, sp:21, sc:.72},
  {k:0, y:126, sp:6,  sc:.8}
];
const POLLEN = Array.from({length:26}, (_,i)=>({
  x: (i*137+43)%W, y: 120+((i*97)%430), sp: 10+(i%7)*5, r: 1.4+(i%5)*.9, ph: i*1.7
}));
function render2d(t){
  ctx.setTransform(RS,0,0,RS,0,0);
  if(shake > 0){
    const m = shake*8*shakePow;
    ctx.translate((Math.random()-.5)*m, (Math.random()-.5)*m);
  }
  // 底图
  ctx.drawImage(bg, 0, 0);
  // 母猪王铭牌(始终在猪头顶之上)
  if(hero){
    ctx.font = "600 21px 'Optima','Palatino Linotype',Georgia,serif";
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,246,222,.95)';
    ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 9;
    ctx.fillText(`母猪王 · ${hero.tn} 吨`, HERO_PED_X, hero.standY - hero.s*34 - 12);
    ctx.shadowBlur = 0;
  }
  // 太阳:光晕 + 旋转光芒(加色混合)
  ctx.globalCompositeOperation = 'lighter';
  ctx.save(); ctx.translate(1250,196);
  ctx.rotate(t*.021);
  ctx.globalAlpha = .85;
  ctx.drawImage(SPR_RAYS, -450, -450, 900, 900);
  ctx.restore();
  ctx.globalAlpha = 1;
  ctx.drawImage(SPR_HALO, 1250-210, 196-210, 420, 420);
  ctx.globalCompositeOperation = 'source-over';
  // 日轮
  const sunG = ctx.createRadialGradient(1250,196,10,1250,196,54);
  sunG.addColorStop(0,'#fffdf0'); sunG.addColorStop(.55,'#ffeec2'); sunG.addColorStop(1,'rgba(255,226,168,0)');
  ctx.fillStyle = sunG; ctx.beginPath(); ctx.arc(1250,196,54,0,TAU); ctx.fill();
  // 云
  for(const c of CLOUDS){
    const cx = ((t*c.sp + c.k*400) % (W+520)) - 260;
    ctx.globalAlpha = .95;
    ctx.drawImage(SPR_CLOUDS[c.k], cx, c.y - 65*c.sc, 340*c.sc, 130*c.sc);
  }
  ctx.globalAlpha = 1;
  // 浮尘
  for(const p of POLLEN){
    const px = (p.x + t*p.sp) % (W+40) - 20;
    const py = p.y + Math.sin(t*1.1 + p.ph)*12;
    const a = .18 + .22*Math.sin(t*2.3 + p.ph);
    ctx.globalAlpha = Math.max(a, 0);
    const s = p.r*4;
    ctx.drawImage(SPR_POLLEN, px-s/2, py-s/2, s, s);
  }

  }

    ctx.scale((d.flip? -1:1)*1.35, 1.35);
    if(d.phase === 1) ctx.rotate(d.rot);

  }

  ctx.fillStyle = gradWater; ctx.fillRect(0, WATER_Y, W, H-WATER_Y);
  ctx.fillStyle = gradBedHaze; ctx.fillRect(0, WATER_Y, W, 220);
  // 焦散光网(平铺图案,缓慢漂移,只贴上层水)
  if(causticOn){
    ctx.globalAlpha = .26;
    ctx.save();
    ctx.translate(-((t*13)%256), WATER_Y - 20 - ((t*7)%256));
    ctx.fillStyle = patCaustic;
    ctx.fillRect(0, 0, W+256, (H-WATER_Y)*.72+256);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
  // 水下光柱(加色)
  ctx.globalCompositeOperation = 'lighter';
  for(let i=0;i<5;i++){
    const lx = ((i*347 + t*34) % (W+280)) - 140;
    ctx.globalAlpha = .28 + .1*Math.sin(t*.7+i);
    ctx.drawImage(SPR_SHAFT, lx, WATER_Y-6, 190, 380);
  }
  ctx.globalAlpha = 1;
  // 太阳倒影光柱
  const gl = 1244 + Math.sin(t*.6)*10;
  const refl = ctx.createLinearGradient(0, WATER_Y, 0, H);
  refl.addColorStop(0,'rgba(255,228,168,.34)');
  refl.addColorStop(.5,'rgba(255,214,150,.09)');
  refl.addColorStop(1,'rgba(255,200,140,0)');
  ctx.fillStyle = refl;
  ctx.beginPath(); ctx.moveTo(gl-46, WATER_Y);
  ctx.lineTo(gl+46, WATER_Y); ctx.lineTo(gl+96, H); ctx.lineTo(gl-96, H); ctx.closePath(); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // 水面波带
  for(let k=0;k<2;k++){
    ctx.fillStyle = k? 'rgba(150,214,240,.22)' : 'rgba(214,244,255,.42)';
    ctx.beginPath(); ctx.moveTo(0, WATER_Y+1);
    for(let x=0;x<=W;x+=42) ctx.lineTo(x, WATER_Y + Math.sin(x*.019 + t*(2.1+k) + k*2.3)*4.4);
    ctx.lineTo(W, WATER_Y+13+k*6); ctx.lineTo(0, WATER_Y+13+k*6); ctx.closePath(); ctx.fill();
  }
  // 水面高光碎金
  for(let i=0;i<20;i++){
    const gx = ((i*97 + t*120) % (W+60)) - 30;
    const gy = WATER_Y + 5 + (i*29)%20;
    const a = .1 + .16*Math.sin(t*2.6+i*1.3);
    if(a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.drawImage(SPR_GLINT, gx-30, gy-6, 60, 12);
  }
  ctx.globalAlpha = 1;
  // 涟漪
  for(const r of ripples){
    ctx.globalAlpha = Math.max(r.a,0);
    ctx.drawImage(SPR_RING, r.x-r.r, r.y-r.r*.3, r.r*2, r.r*.6);
  }
  ctx.globalAlpha = 1;
  // 冲击波
  if(shock.a > 0){
    ctx.strokeStyle = `rgba(255,255,255,${shock.a*.8})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(shock.x, WATER_Y+8, shock.r, shock.r*.16, 0, 0, TAU); ctx.stroke();
  }
  // 蘑菇水雾
  for(const b of burst){
    const a = 1 - b.t/b.life;
    ctx.fillStyle = b.puff? `rgba(244,250,255,${a*.7})` : `rgba(238,249,255,${a*.88})`;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r*(b.puff? 1+b.t*.5 : 1), 0, TAU); ctx.fill();
  }
  // 飞溅水珠
  for(const d of drops){
    ctx.globalAlpha = 1 - d.t/d.life;
    ctx.drawImage(SPR_DROP, d.x-d.r, d.y-d.r, d.r*2, d.r*2);
  }
  ctx.globalAlpha = 1;
  // 胶片颗粒(最上层,极淡)
  if(grainOn){
    ctx.globalAlpha = .045;
    ctx.fillStyle = patGrain;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
}
function paintDeer(g, t){
  const leg = (a,b,c2,d)=>{ g.beginPath(); g.moveTo(a,b); g.lineTo(c2,d); g.stroke(); };
  g.save(); g.translate(-44,0);
  g.fillStyle = '#c62828'; g.beginPath(); g.ellipse(-6,-14,8,10,0,0,TAU); g.fill();
  g.fillStyle = '#ffd9b3'; g.beginPath(); g.arc(-6,-26,4.5,0,TAU); g.fill();
  g.fillStyle = '#c62828'; g.beginPath(); g.moveTo(-11,-28); g.lineTo(-1,-28); g.lineTo(-6,-38); g.closePath(); g.fill();
  g.fillStyle = '#fff'; g.beginPath(); g.arc(-6,-38,2.2,0,TAU); g.fill();
  g.beginPath(); g.ellipse(-2.5,-22,3.5,2,-.4,0,TAU); g.fill();
  g.fillStyle = '#2e5d34'; g.beginPath(); g.ellipse(7,-18,7,8,0,0,TAU); g.fill();
  g.fillStyle = '#c62828'; g.beginPath();
  g.moveTo(-18,4); g.quadraticCurveTo(-20,-6,-10,-6); g.lineTo(12,-6);
  g.quadraticCurveTo(20,-6,18,2); g.quadraticCurveTo(24,2,22,6); g.lineTo(-16,6); g.closePath(); g.fill();
  g.strokeStyle = '#f5c04e'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(-19,9); g.lineTo(20,9); g.stroke();
  g.restore();
  g.strokeStyle = '#8d6e63'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(-30,-10); g.quadraticCurveTo(-10,-14,8,-8); g.stroke();
  for(let k=0;k<2;k++){
    g.save(); g.translate(8+k*30, k? -2:0);
    const gp = Math.sin(t*13 + k*1.7)*.6;
    g.fillStyle = '#8d6e63';
    g.beginPath(); g.ellipse(0,-8,11,6.5,-.08,0,TAU); g.fill();
    g.beginPath(); g.arc(10,-15,4.5,0,TAU); g.fill();
    g.beginPath(); g.ellipse(13.5,-13.5,2.5,1.8,0,0,TAU); g.fill();
    g.strokeStyle = '#5d4037'; g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(9,-19); g.lineTo(6,-26); g.moveTo(7,-22); g.lineTo(4,-25);
    g.moveTo(12,-19); g.lineTo(14,-26); g.moveTo(13,-22); g.lineTo(16,-24); g.stroke();
    g.strokeStyle = '#8d6e63'; g.lineWidth = 2.6;
    leg(-7,-4,-11,4+gp*3); leg(-3,-4,-2,5-gp*3); leg(4,-4,7,4+gp*2.5); leg(8,-4,12,5-gp*2.5);
    if(k === 0){
      g.fillStyle = 'rgba(255,80,80,.32)'; g.beginPath(); g.arc(15,-13,4.5,0,TAU); g.fill();
      g.fillStyle = '#ff2d2d'; g.beginPath(); g.arc(15,-13,2.2,0,TAU); g.fill();
    }
    g.restore();
  }
}

/* ══ 实例收集 ═════════════════════════════════════════════ */
let instN = 0;
function buildInstances(t){
  instN = 0;
  const bobT = t*11;
  for(let k=0;k<aliveN;k++){
    const i = ALIVE[k];
    const o = instN*6;
    let py = PY[i], alpha = 1, tint = 0;
    if(PH[i] === 0){
      py += Math.abs(Math.sin(bobT + WOB[i]))*2.2*SC[i];
    } else if(PH[i] === 2){
      const depth = py - WATER_Y;
      alpha = AL[i]*(0.35+0.65*Math.min(1, depth/24));
      tint = Math.min(.45, .12 + depth/500);
    }
    INST[o] = PX[i]; INST[o+1] = py; INST[o+2] = SPR*SC[i];
    INST[o+3] = VAR[i]; INST[o+4] = alpha; INST[o+5] = tint;
    instN++;
  }
  if(hero){
    if(hero.t < hero.standDur){
      pushHero(HERO_PED_X, hero.standY + Math.abs(Math.sin(hero.t*8.5))*2, TILE_WALK, hero.s);
    } else {
      const u = (hero.t - hero.standDur)/1.3;
      const hx = HERO_PED_X + (hero.landX - HERO_PED_X)*u;
      const hy = hero.standY - (110 + hero.tn)*Math.sin(Math.PI*u) + u*u*((WATER_Y+14) - hero.standY);
      pushHero(hx, hy, u > .45? 1 : TILE_WALK, hero.s);
    }
  }
}
function pushHero(x,y,tile,s){
  const o = instN*6;
  INST[o]=x; INST[o+1]=y; INST[o+2]=SPR*s; INST[o+3]=tile; INST[o+4]=1; INST[o+5]=0;
  instN++;
}

/* ══ 画质档 ═══════════════════════════════════════════════ */
let causticOn = true, grainOn = true, SAFE = false;
const MAX_PIXELS = 2.6e6;          // 后备缓冲总像素上限,压住移动端显存压力
function applyQuality(q){
  const base = [.75, 1, DPR][q];
  const capPx = Math.sqrt(MAX_PIXELS / (W*H));
  const capVp = innerWidth < 900? 1 : capPx;
  RS = Math.max(.5, Math.min(base, capPx, SAFE? 1 : capVp));
  dropBudget   = [0, 1, 3][q];
  rippleBudget = [.2, .5, 1][q];
  bubbleBudget = [.3, .65, 1][q];
  causticOn = q > 0;
  grainOn = q > 1;
  for(const c of [cv, glc]){
    const w = Math.round(W*RS), h = Math.round(H*RS);
    if(c.width !== w || c.height !== h){ c.width = w; c.height = h; }
  }
  fitCanvas();
}
/* 画布按 16:9 等比适配视口(contain),竖屏不再被拉扁 */
function fitCanvas(){
  const vw = innerWidth, vh = innerHeight;
  const s = Math.min(vw/W, vh/H);
  const w = Math.round(W*s), h = Math.round(H*s);
  const x = Math.round((vw - w)/2), y = Math.round((vh - h)/2);
  for(const c of [cv, glc]){
    c.style.width = w+'px'; c.style.height = h+'px';
    c.style.left = x+'px'; c.style.top = y+'px';
  }
}

/* ══ 主循环 ═══════════════════════════════════════════════ */
const $ = id => document.getElementById(id);
const statEl = $('stat'), countEl = $('count'), diagEl = $('diag');
let last = performance.now(), fps = 60, hudT = 0, acc = 0, qCheck = 0, quality = 2;
let fpsFrames = 0, fpsTime = 0, errOnce = null, frames = 0;
function loop(now){
  requestAnimationFrame(loop);
  try{ frame(now); }
  catch(e){ if(!errOnce) errOnce = ((e && e.name) || 'ERR') + ': ' + ((e && e.message) || e); }
}
function frame(now){
  frames++;
  let dt = (now - last)/1000; last = now;
  if(dt > .1) dt = .1;
  fpsFrames++; fpsTime += dt;
  if(fpsTime >= .5){ fps = fpsFrames/fpsTime; fpsFrames = 0; fpsTime = 0; }
  if(!paused){
    acc += dt;
    if(acc > .25) acc = .25;
    let steps = 0;
    while(acc >= STEP && steps < 3){ update(STEP, now/1000 - acc); acc -= STEP; steps++; }
    if(steps === 3) acc = 0;      // 落后太多就丢弃,保证不掉帧
  }
  const t = now/1000;
  buildInstances(t);
  render2d(t);
  if(RENDERER.kind === 'webgl2'){
    if(GL_LOST || (gl && gl.isContextLost && gl.isContextLost())) fallbackTo2D();
    else renderGL();
  }
  qCheck += dt;
  if(qCheck > 1.2){
    qCheck = 0;
    if(fps < 45 && quality > 0){ quality--; applyQuality(quality); }
    else if(fps > 57 && quality < 2){ quality++; applyQuality(quality); }
  }
  hudT += dt;
  if(hudT > .25){
    hudT = 0;
    countEl.textContent = total.toLocaleString();
    const cls = fps >= 55? 'hot' : (fps < 40? 'warn' : '');
    statEl.innerHTML =
      `<span style="opacity:.7">${RENDERER.gpuName.slice(0,20)}</span> ${RENDERER.tag} · ` +
      `<span class="${cls}">${Math.round(fps)} FPS</span> · 在场 ${aliveN.toLocaleString()} · Q${quality}`;
    diagEl.textContent =
      `${RENDERER.kind}  ${Math.round(fps)}fps  f${frames}\n` +
      `canvas ${glc.width}x${glc.height} @${RS.toFixed(2)} dpr${DPR.toFixed(2)}\n` +
      `alive ${aliveN}  dived ${total}\n` +
      (errOnce ? 'ERR ' + errOnce.slice(0, 68) : (GL_LOST ? 'GL LOST → 2D' : 'render ok'));
    if(total >= 100000) $('ach').style.display = 'inline';
  }
}
async function main(){
  const Q = new URLSearchParams(location.search);
  const PRE = Math.min(parseFloat(Q.get('t') || '0') || 0, 120);
  SAFE = Q.get('safe') === '1';
  for(let i=0; i < PRE*60; i++) update(STEP, i*STEP);
  if(Q.get('c2d') === '1'){
    RENDERER = {kind:'canvas2d', gpuName:'强制 Canvas2D', tag:'软件渲染'};
  } else {
    RENDERER = await initRenderer();
  }
  applyQuality(quality);
  $('rateV').textContent = rate.toLocaleString();
  if(Q.get('deer') === '1')
    deer.push({x:W*.5, y:150, vx:40, t:0, seed:1, fallAt:W*.9, phase:0, rot:0, vr:0, vy:0, flip:false});
  if(Q.get('hero') === '1'){
    const tn = 66, s = 1.9 + tn/99*1.4;
    hero = {t:0, tn, s, standY: HERO_PED_TOP - s*16, standDur: 1e9, landX: 680};
  }
  if(PRE > 0) countEl.textContent = total.toLocaleString();
  requestAnimationFrame(loop);
}
main();
addEventListener('resize', ()=>applyQuality(quality));
$('rate').oninput = e => { rate = sliderRate(+e.target.value); $('rateV').textContent = rate.toLocaleString(); };
$('burst').onclick = () => {
  rate = sliderRate(SLIDER_MAX);
  $('rate').value = SLIDER_MAX;
  $('rateV').textContent = rate.toLocaleString();
};
$('snd').onclick = () => {
  muted = !muted;
  if(!muted){ ensureAudio(); if(AC && AC.state === 'suspended') AC.resume(); }
  $('snd').textContent = muted? '🔇 音效' : '🔊 音效';
};
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused? '▶ 继续' : '‖ 暂停'; };
